name: Calendar preview once

on:
  push:
    branches: [cursor/plain-language-nfp-chart-5a96]
    paths: [.github/workflows/preview-one-send.yml]

permissions:
  contents: write

concurrency:
  group: preview-one-send
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet requests matplotlib
      - name: Jadwal hari ini ke Discord
        run: python calendar_bot.py
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          COUNTRIES: ID,US,CN,EU,JP
          MIN_ALERT: SEDANG
          PREVIEW_NOW: "1"
          PREVIEW_HOUR_WIB: "7"
      - name: Simpan tanggal jadwal
        if: success()
        run: |
          git config user.name "econ-bot"
          git config user.email "econ-bot@users.noreply.github.com"
          git add data/calendar_state.json || exit 0
          git diff --cached --quiet && exit 0
          git commit -m "calendar: jadwal 9 Nov sudah terkirim"
          git pull --rebase --autostash
          git push
