name: Calendar Bot (TradingView -> Discord)

on:
  schedule:
    # Senin–Jumat. Cron GitHub memakai UTC. 00:00 UTC = 07:00 WIB (Asia/Jakarta).
    # Run 00:00 UTC adalah kiriman jadwal harian. preview_date menahan ulang di hari yang sama.
    #   00-07 UTC = 07:00-14:59 WIB -> jadwal pagi, China, Jepang, BPS, BI
    #   12-15 UTC = 19:00-22:59 WIB -> data AS (CPI, NFP, PCE, GDP, ISM)
    #   18-19 UTC = 01:00-02:59 WIB -> keputusan FOMC
    - cron: "*/15 0-7,12-15,18-19 * * 1-5"
  workflow_dispatch:
    inputs:
      test_send:
        description: Kirim satu rilis terakhir ke Discord saja
        required: false
        default: false
        type: boolean

concurrency:
  group: repo-write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install --quiet requests matplotlib
      - name: Jalankan calendar bot
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.test_send != true }}
        run: python calendar_bot.py
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SHEETS_WEBHOOK_URL: ${{ secrets.SHEETS_WEBHOOK_URL }}
          SHEETS_TOKEN: ${{ secrets.SHEETS_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          COUNTRIES: ID,US,CN,EU,JP
          MIN_ALERT: SEDANG
          SEND_PREVIEW: "1"
          PREVIEW_HOUR_WIB: "7"
      - name: Satu rilis ke Discord
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_send == true }}
        run: python calendar_bot.py
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          COUNTRIES: ID,US,CN,EU,JP
          MIN_ALERT: SEDANG
          TEST_SEND: "1"
      - name: Simpan state
        if: always()
        run: |
          git config user.name "econ-bot"
          git config user.email "econ-bot@users.noreply.github.com"
          git add data/calendar_state.json || exit 0
          git diff --cached --quiet && exit 0
          git commit -m "calendar: state update"
          git pull --rebase --autostash
          git push
