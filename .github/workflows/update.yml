name: Economic Outlook Bot

on:
  schedule:
    - cron: "0 1,13 * * 1-5"   # hemat kuota: 2x sehari Senin-Jumat (08:00 & 20:00 WIB)
  workflow_dispatch:         # tombol "Run workflow" manual

concurrency:
  group: repo-write
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Jalankan bot
        run: python bot.py
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          BPS_API_KEY: ${{ secrets.BPS_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Simpan data ke repo
        run: |
          git config user.name "econ-bot"
          git config user.email "econ-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "data: update $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase --autostash
          git push
