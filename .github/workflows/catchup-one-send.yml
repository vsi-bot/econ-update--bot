name: Missed releases once

on:
  push:
    branches: [cursor/plain-language-nfp-chart-5a96]
    paths: [.github/workflows/catchup-one-send.yml]

permissions:
  contents: read

concurrency:
  group: catchup-one-send
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet requests matplotlib
      - name: Rilis yang terlewat ke Discord
        run: python calendar_bot.py
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          COUNTRIES: ID,US,CN,EU,JP
          MIN_ALERT: SEDANG
          CATCHUP_SEND: "1"
          CATCHUP_IDS: "1001661128601,1001661128602,1001662025201"
          CATCHUP_ACTUALS: '{"1001661128601":0.7,"1001661128602":0,"1001662025201":119.9}'
